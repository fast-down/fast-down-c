[package]
name = "fast_down"
version = "0.1.1"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
arc-swap = "1.9.1"
bytes = "1.11.1"
fast-down-ffi = { version = "0.2.7", features = ["file", "mem", "reqwest-tls"] }
parking_lot = "0.12.5"
path_helper = { version = "0.1.2", features = ["sanitize"] }
tokio = { version = "1.51.1", features = ["full"] }
tokio-util = "0.7.18"
url = "2.5.8"

[build-dependencies]
cbindgen = "0.29.2"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# cargo = { level = "deny", priority = -1 }
# restriction = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing-safety-doc = "allow"

[profile.release]
opt-level = 3
strip = true
lto = true
panic = "abort"
codegen-units = 1
